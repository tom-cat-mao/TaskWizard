name: Build and deploy MkDocs site

# Deployment only.  Pull-request checking lives in ci.yml's `docs` job: that
# workflow owns "is this change correct?" on every PR and every push to main,
# while this workflow owns "publish what main already accepted".  Keep the two
# apart so a red style/test gate can never block a site deploy and a deploy
# failure can never be mistaken for a review verdict.

on:
  push:
    branches: [main]
    paths:
      - pages/**
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - name: Upload validation artifact (non-main runs)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site-preview
          path: site
          retention-days: 7
      - name: Upload Pages artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
